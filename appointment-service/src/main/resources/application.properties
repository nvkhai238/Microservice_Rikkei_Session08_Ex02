spring.application.name=APPOINTMENT-SERVICE
server.port=${SERVER_PORT:8083}

spring.datasource.url=${APPOINTMENT_DB_URL:jdbc:postgresql://localhost:5432/medical_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5

spring.cloud.loadbalancer.retry.enabled=false
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,ratelimiters,ratelimiterevents,timelimiters
management.endpoint.health.show-details=always
logging.level.io.github.resilience4j=DEBUG
doctor-service.url=${DOCTOR_SERVICE_URL:http://DOCTOR-SERVICE}
insurance-service.url=${INSURANCE_SERVICE_URL:http://INSURANCE-SERVICE}

resilience4j.circuitbreaker.instances.doctorServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.doctorServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.doctorServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.doctorServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.doctorServiceCB.record-exceptions=org.springframework.web.client.ResourceAccessException
